spring.application.name=Library

# Stage B1: opt-in SDK only; no production payment caller yet.
payos.enabled=${PAYOS_ENABLED:false}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
# Keep disabled until schema, webhook and security verification are complete.
payos.creation-enabled=${PAYOS_CREATION_ENABLED:false}
payos.return-url=${PAYOS_RETURN_URL:}
payos.cancel-url=${PAYOS_CANCEL_URL:}

server.port=8000

# Return-book fine policy (VND and decimal rates).
app.fines.overdue-daily-rate=5000
app.fines.light-damage-rate=0.25
app.fines.severe-damage-rate=0.75
app.fines.loss-processing-fee=20000
app.fines.default-reference-price=100000

# JWT has no source-code fallback. JWT_SECRET must contain at least 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Reservation pickup window is 72 hours; scan expired holds once per minute by default.
app.reservations.expiry-scan-delay-ms=${RESERVATION_EXPIRY_SCAN_DELAY_MS:60000}
app.reservations.expiry-scan-initial-delay-ms=${RESERVATION_EXPIRY_SCAN_INITIAL_DELAY_MS:60000}

# Book-cover uploads use local disk; override these in deployments as needed.
app.storage.book-covers-dir=${BOOK_COVERS_DIR:uploads/book-covers}
app.storage.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.hibernate.ddl-auto=validate
app.initialize-admin=${APP_INITIALIZE_ADMIN:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Library Administrator}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
