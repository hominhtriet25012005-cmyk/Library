spring.datasource.url=jdbc:h2:mem:library_unit_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

app.initialize-admin=false
app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
app.jwt.expiration-ms=60000

payos.enabled=false
payos.creation-enabled=false

spring.mail.host=localhost
spring.mail.port=3025
